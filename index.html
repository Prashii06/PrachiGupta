<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ShopEasy</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav>
    <h1>ShopEasy</h1>

    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Products</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact Us</a></li>
    </ul>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <h2>Big Sale is Live!</h2>
    <p>Discover the best products at amazing prices.</p>
    <button>Shop Now !</button>
  </section>

  <section class="products">
    <h2>Featured Products</h2>

    <div class="product-container">

      <div class="card">
        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=800" alt="Shoes">

        <div class="card-content">
          <h3>Running Shoes</h3>
          <p class="price">$49</p>
          <button>Add to Cart</button>
        </div>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=800" alt="Watch">

        <div class="card-content">
          <h3>Smart Watch</h3>
          <p class="price">$79</p>
          <button>Add to Cart</button>
        </div>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=800" alt="Phone">

        <div class="card-content">
          <h3>Mobile Phone</h3>
          <p class="price">$299</p>
          <button>Add to Cart</button>
        </div>
      </div>

    </div>
  </section>

  <footer>
    <p>© 2026 ShopEasy. All Rights Reserved.</p>
  </footer>

</body>
</html>
